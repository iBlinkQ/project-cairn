version: 0.1
defaults:
  # NOTE: git_policy / reference_git_policy deliberately do NOT belong here.
  # They are properties of a repository (public OSS? client-private? throwaway
  # sandbox?), not habits of a person, so the previous project's answer has no
  # predictive value for the next one — and the two error directions are not
  # symmetric: silently committing a cairn/ that should have stayed private is
  # irreversible, while a missed commit is not. Every init asks for them.
  # See references/init.md → "Per-project decisions (never inherited)".
  migration_mode: "{{MIGRATION_MODE}}"
  language: "{{DOC_LANGUAGE}}"
providers:
  # Keyed by provider type, not a list — a user typically has one habitual
  # target per provider type, so a list would raise "which one is the
  # default" ambiguity a dict avoids. Populate only the providers actually
  # in personal use; omit the rest.
  obsidian:
    vault: "<vault name>"
    target: "<vault-relative knowledge dir>"
    index: "<vault-relative INDEX.md>"
    link_format: wikilink
  lark-wiki:
    space_id: "<wiki space id>"
    index: "<wiki INDEX node url>"
    index_node_token: "<index node token>"
    scope: "wiki:wiki"
    api: native
    identity: user
    link_format: url
  notion:
    database_id: "<notion database id>"
    index: "<DB human URL>"
    parent_page_id: "<page the DB lives under>"
    frontmatter_mode: properties
    transport: rest
    api: native
    notion_version: "2022-06-28"
    identity: integration_token
    credential_env: NOTION_API_TOKEN
    link_format: url
